[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorwright"
version = "0.0.0"
description = "Cross-layer debugging platform for quantized AI accelerators"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hank Lee" }]
dependencies = [
    "numpy>=1.23.2,<3",
    "onnx>=1.16,<2",
]

[project.optional-dependencies]
dev = [
    "cocotb>=2.0,<3; python_version < '3.14'",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
tensorwright = "tensorwright.cli:main"

[tool.setuptools.packages.find]
include = ["tensorwright*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
files = ["tensorwright", "tests", "scripts", "verification/cocotb"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "onnx", "onnx.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cocotb", "cocotb.*", "cocotb_tools", "cocotb_tools.*"]
follow_imports = "skip"
ignore_missing_imports = true
